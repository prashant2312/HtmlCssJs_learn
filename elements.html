<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>inline and block elements</title>
</head>
<body>
    <p>this is a paragraph</p> <p>this is also a paragraph</p>
    <!-- paragraph is a block element  so it cannot be come in a single line. it take the whole space-->
     <span>this is a span</span> <span>this is also a span</span>
     <!-- span is an inline element so it can be in a single line -->
      <!-- anchor tag means a ,strong and em is a inline element -->
       <!-- list and div is a block element -->
</body>
</html>
