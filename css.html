<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css tutorial</title>
    <link rel="stylesheet" href="style.css">
    <!-- this is used for linking the external css file -->
    <style>
        p{
            color:black;
            background-color: lightblue !important;

        }
        /* jo chij bad me likhi ho means internal or external css usko jada importance di jati h */
        /* !important is used to give importance over the other css */
         
    </style> 
</head>
<body>
    <h3>this is css tutorial</h3>
    <!-- <p style="color:red;background-color: yellow;">this tutorial will teach you everything you need to know about html/ CSS</p> -->
    <p>this tutorial will teach you everything you need to know about html</p>
</body>
</html>
