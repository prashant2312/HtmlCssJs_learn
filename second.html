<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>links and images</title>
</head>
<body>
    <a href="https://google.com" target="_blank">Go to google</a><br>
    <!-- target attribute is used for opening the new website in new tab -->
    <a href="https://facebook.com" target="_blank">Go to facebook</a><br>
    <a href="/first.html" target="_blank">first</a><br>

    <!-- src is used for linking the image and alt text is shown when image is not present -->

    <img src="bhawna.jpg" alt="error loading image">
    <img src="https://source.unsplash.com/200*100/?nature,water" alt="remote image">
    
    

</body>
</html>
