<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>html entities</title>
</head>
<body>
    <div class="container">
        <p>this is a paragraph</p>

    </div>
    <div class="container">
        <p>this is another &nbsp; paragraph with one space</p>
        <p>paragraph is written like this &lt;p&gt;</p>
    </div>
    <!-- &nbsp is used to make space between words -->
     <!-- if we want to show p tag in our website or document then we write &lt;before p and &gt; after p -->

</body>
</html>
